[package]
name = "radiofm"
version = "0.1.0"
edition = "2024"
readme = "README.md"
description = "A radio application in the terminal."
authors = ["Kazooki123 <mgamerdinge146@gmail.com>"]
repository = "https://github.com/Kazooki123/radiofm.rs"
license = "MIT"

[[bin]]
name = "radiofm"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
directories = "5"
rand = "0.8"
num-complex = "0.4"
rtl-sdr-rs = { version = "0.2", optional = true }

[features]
hardware = ["dep:rtl-sdr-rs"]

[profile.release]
opt-level = 3
lto = true
